Frontend:
  impl: SimpleO3
  clock_ratio: 4
  num_expected_insts: 10000000
  traces: 
    - stream_10M.trace

  Translation:
    impl: RandomTranslation
    max_addr: 8589934592   

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 2
  output_dir: ./results
  output_file: stream_10M_d16

  DRAM:
    impl: HBM3
    org:
      preset: HBM3_4Gb       # HBM3.cpp: {4<<10, 128, {1,2,4,4, 1<<14, 1<<6}} -> 16384 rows, 64 cols
      channel: 16
      pseudochannel: 2
      channel_width: 128     # HBM3 DQ. prefetch(2) x 128/8 = 32 B transaction
                             # -> 32 addressable column slots x 32 B = 1 KB page (JEDEC)
    timing:
      preset: HBM3_2Gbps     # the only timing preset in HBM3.cpp

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: NoRefresh
    RowPolicy:
      impl: OpenRowPolicy
    plugins:

  AddrMapper:
    impl: ChRaBaRoCo