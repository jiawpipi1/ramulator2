Frontend:
  impl: LoadStoreTrace
  clock_ratio: 4
  path: hbm_test.trace

  Translation:
    impl: RandomTranslation
    max_addr: 2147483648

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 2

  DRAM:
    impl: HBM2
    org:
      preset: HBM2_8Gb
      channel: 1
      pseudochannel: 2
    timing:
      preset: HBM2_2Gbps

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: NoRefresh
    RowPolicy:
      impl: OpenRowPolicy
    plugins:

  AddrMapper:
    impl: ChRaBaRoCo