# Ramulator2 config for use as a gem5 memory (src/mem/ramulator2.cc).
#
# The ONLY difference from hbm3.yaml is the frontend: gem5 drives the requests,
# so we select the GEM5 frontend (which just forwards
# receive_external_requests() into the memory system) instead of a trace reader.
#
# Set the repair table from the gem5 config with:
#   Ramulator2(configFile=..., ...)  and edit repair_table_path below, or
#   generate a per-run copy of this file.

Frontend:
  impl: GEM5
  clock_ratio: 1          # unused for GEM5 (gem5 owns the clock), kept for the API

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1
  output_dir: ./results
  output_file: gem5_hbm3

  DRAM:
    impl: HBM3
    org:
      preset: HBM3_4Gb     # 16384 rows, 64 columns
      channel: 16
      pseudochannel: 2
      channel_width: 128   # prefetch(2) x 128/8 = 32 B transaction
                           # -> 32 addressable column slots x 32 B = 1 KB page (JEDEC)
    timing:
      preset: HBM3_2Gbps

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank        # realistic: refresh ON (NoRefresh is only for smoke tests)
    RowPolicy:
      impl: OpenRowPolicy
    # Per-die repair table produced by repairv2 --dump-json.
    # Comment out for the fault-free baseline.
    repair_table_path: json/remap_hbm3_smoke.json
    # The blocked Bloom reads all eight probes from one 512-bit SRAM row. There is ONE
    # probe per request, on the post-Layer-D key. Bloom rejects take the fast
    # path; Bloom maybes take the slow A/B/C path. These are sensitivity
    # assumptions, not bounds.
    repair_fast_lookup_latency: 1
    repair_slow_lookup_latency: 12
    # true : a Bloom reject is FAST even when Layer D relocated the request.
    #        D is combinational (bank bitmap + address math) and reads no repair
    #        table, so a relocated request with no A/B/C entry does no more table
    #        work than a pass-through. Requires probing the Bloom with the post-D
    #        key without serialising bitmap -> relocate -> Bloom: probe the
    #        original and relocated keys in parallel and mux on the dead bit. The
    #        current filter is 4,032 B, so duplicating it (~8 KB) is modest.
    # false: legacy/conservative -- every dead-bank access pays the slow latency.
    repair_unified_gate: true
    # spread    : published/original Layer-D mapping (default); each dead bank
    #             uses short runs across every live bank.
    # clustered : opt-in locality experiment; each dead bank gets disjoint
    #             target banks and uses vacuum_limit contiguous rows per target.
    # Both reserve the same vacuum_limit rows per live bank. Never overwrite the
    # spread baseline when naming or reporting clustered experiments.
    repair_d_mapping: spread
    layer_a_data_latency: 6    # logic-die SRAM data access; Layer A bypasses DRAM
    repair_pipeline_size: 64   # bounded pre-controller lookup/SRAM pipeline
    plugins:

  AddrMapper:
    impl: LineRoBaRaCoCh   # channel interleaved at CACHE-LINE granularity:
    line_size: 64          #   [row|ba|ra|col_hi|ch|col_lo|32B]
                           # - both 32 B halves of a 64 B line stay in ONE
                           #   channel/bank/row (2nd half = row-buffer hit)
                           # - consecutive lines rotate across all 16 channels
                           # Plain RoBaRaCoCh splits every line across two
                           # channels; ChRaBaRoCo (channel in the TOP bits)
                           # would put ALL gem5 SE traffic on channel 0.
